[workspace]
members = ["crates/audio-decode", "crates/audio-decode-wasm"]
default-members = ["crates/audio-decode"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/gumi-conqueror/audio-decode"

[workspace.dependencies]
audio-decode = { path = "crates/audio-decode", version = "0.2.0" }
# Keep native consumers on the decoder version used by the prebuilt WASM package.
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3", "aac", "isomp4", "mkv", "alac", "aiff", "id3v1", "id3v2", "ape"] }
# The CLI must match this version exactly when it generates JavaScript bindings.
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
# Preserve WASM target_features for wasm-bindgen.
strip = "debuginfo"
